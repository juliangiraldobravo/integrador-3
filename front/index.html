<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrologic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060914; --surface:rgba(15,21,48,.72); --surface-2:rgba(8,12,30,.65);
  --ink:#eef2ff; --muted:#9aa7cf; --line:rgba(140,160,255,.16); --line-strong:rgba(140,160,255,.32);
  --accent:#ffb347; --accent-2:#ff9a3d; --accent-ink:#1b1204; --glow:#7482ff;
  --ok:#5fe3b0; --err:#ff9a9a; --radius:12px;
  --display:"Syne","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 560px at 88% -8%,rgba(116,130,255,.26),transparent 62%),
             radial-gradient(760px 520px at -12% 38%,rgba(126,64,180,.2),transparent 62%),var(--bg);
  background-attachment:fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#stars .tw{animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:20px 24px 40px}
header.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--display);letter-spacing:.02em}
.brand svg{width:28px;height:28px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.demo{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding:56px 0 64px}
.hero h1{font:700 clamp(40px,5.6vw,64px)/1.04 var(--display);margin:0 0 18px;letter-spacing:-.025em}
.hero p{margin:0 0 28px;max-width:46ch;color:var(--muted);font-size:17px}
.cta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.system{width:100%;max-width:440px;justify-self:center;filter:drop-shadow(0 0 40px rgba(116,130,255,.18))}
.system .path{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:2 6}
.system .orb{transform-origin:200px 200px;animation:spin linear infinite}
.o1{animation-duration:24s}.o2{animation-duration:46s}.o3{animation-duration:80s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.system .orb,#stars .tw{animation:none}html{scroll-behavior:auto}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -24px rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.card-head{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.card-head svg{width:20px;height:20px;color:var(--accent);flex:none}
h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:-.005em}
.count{display:inline-block;min-width:24px;margin-left:6px;padding:1px 8px;border-radius:999px;background:rgba(116,130,255,.18);color:var(--ink);font:700 13px/20px var(--body);text-align:center;vertical-align:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:18px}
.tabs button{background:none;border:0;border-radius:7px;color:var(--muted);font:600 14px var(--body);padding:9px 10px;cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:rgba(116,130,255,.22);color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
input:hover,textarea:hover{border-color:rgba(140,160,255,.5)}
input:focus,textarea:focus{outline:0;border-color:var(--glow);box-shadow:0 0 0 3px rgba(116,130,255,.28)}
textarea{resize:vertical;min-height:84px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:var(--accent-ink);border:0;border-radius:8px;font:700 15px var(--body);padding:11px 20px;cursor:pointer;text-decoration:none;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 20px -8px rgba(255,160,60,.6);transition:transform .12s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 24px -8px rgba(255,160,60,.7)}
.btn:active{transform:none}
.btn.block{width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong);box-shadow:none;margin:0;padding:7px 13px;font-weight:600;font-size:13px}
.btn.ghost:hover{background:rgba(116,130,255,.14);transform:none;box-shadow:none}
.cta .btn{margin-top:0}
.link{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:2px}
.link:hover{border-color:var(--accent)}
.msg{min-height:22px;margin:14px 0 0;font-size:14px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.session{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--glow),#c98cff);color:#0b1030;font:700 18px var(--display);flex:none}
.who{display:flex;align-items:center;gap:12px}
.who small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.who strong{font:700 18px/1.3 var(--display)}
.events{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.events li{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);transition:border-color .15s}
.events li:hover{border-color:var(--line-strong)}
.ev-ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:rgba(255,179,71,.14);color:var(--accent);flex:none}
.ev-ico svg{width:18px;height:18px}
.ev-body{flex:1;min-width:0}
.events h3{margin:0;font:700 16px/1.3 var(--display)}
.events p{margin:2px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.empty{display:block!important;text-align:center;color:var(--muted);padding:28px 16px!important;border-style:dashed!important}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hidden{display:none}
@media (max-width:860px){.hero,.grid{grid-template-columns:1fr}.hero{gap:28px;padding:36px 0 44px}section.card{padding:22px}}
</style>
</head>
<body>
<svg id="stars" aria-hidden="true"></svg>
<div class="wrap">
  <header class="nav">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#ffb347"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="#9aa7cf" stroke-width="1.5" transform="rotate(-28 16 16)"/><circle cx="26" cy="10" r="2" fill="#7482ff"/></svg>Astrologic</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
  </header>

  <div class="hero">
    <div>
      <h1>Tus eventos, en órbita.</h1>
      <p>Crea tu cuenta, inicia sesión y guarda los eventos que quieres tener siempre a la vista.</p>
      <div class="cta"><a class="btn" href="#cuenta" id="ctaReg">Crear cuenta</a><a class="link" href="#eventos">Ver eventos</a></div>
    </div>
    <svg class="system" viewBox="0 0 400 400" role="img" aria-label="Sistema solar decorativo" id="system"></svg>
  </div>

  <div class="grid">
    <section class="card" id="cuenta" aria-labelledby="h-cuenta">
      <div class="card-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><h2 id="h-cuenta">Tu cuenta</h2></div>

      <div id="guest">
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-login" aria-selected="true" data-tab="login">Iniciar sesión</button>
          <button role="tab" id="tab-reg" aria-selected="false" data-tab="reg">Crear cuenta</button>
        </div>

        <form id="f-login" autocomplete="on" novalidate>
          <label for="l-correo">Correo</label>
          <input id="l-correo" type="email" autocomplete="email">
          <label for="l-pass">Contraseña</label>
          <input id="l-pass" type="password" autocomplete="current-password">
          <button class="btn block" type="submit">Iniciar sesión</button>
        </form>

        <form id="f-reg" class="hidden" autocomplete="on" novalidate>
          <label for="r-nombre">Nombre</label>
          <input id="r-nombre" autocomplete="name">
          <label for="r-correo">Correo</label>
          <input id="r-correo" type="email" autocomplete="email">
          <label for="r-pass">Contraseña</label>
          <input id="r-pass" type="password" autocomplete="new-password">
          <button class="btn block" type="submit">Crear cuenta</button>
        </form>
        <p class="msg" id="authMsg" role="status"></p>
      </div>

      <div id="logged" class="session hidden">
        <div class="who"><span class="avatar" id="avatar"></span><div><small>Sesión iniciada como</small><strong id="who"></strong></div></div>
        <button class="btn ghost" id="logout" type="button">Cerrar sesión</button>
      </div>
    </section>

    <section class="card" id="eventos" aria-labelledby="h-ev">
      <div class="card-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg><h2 id="h-ev">Eventos<span class="count" id="evCount">0</span></h2></div>
      <form id="f-ev" novalidate>
        <label for="e-nombre">Nombre del evento</label>
        <input id="e-nombre">
        <label for="e-desc">Descripción</label>
        <textarea id="e-desc"></textarea>
        <button class="btn" type="submit">Guardar evento</button>
      </form>
      <p class="msg" id="evMsg" role="status"></p>
      <ul class="events" id="evList"></ul>
    </section>
  </div>
  <footer><span>Astrologic, proyecto integrador</span><span>Eventos, usuarios y acceso en una sola vista</span></footer>
</div>

<script>
// ---------- Cielo estrellado y sistema orbital (decorativos) ----------
(function(){
  const sky=document.getElementById("stars"); let st="";
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let i=0;i<140;i++){
    const x=(rnd()*100).toFixed(2), y=(rnd()*100).toFixed(2), r=(rnd()*1.3+.3).toFixed(2), o=(rnd()*.6+.3).toFixed(2);
    st+=`<circle cx="${x}%" cy="${y}%" r="${r}" fill="#fff" opacity="${o}"${i%9===0?' class="tw" style="animation-delay:-'+(rnd()*4).toFixed(1)+'s"':''}/>`;
  }
  sky.innerHTML=st;

  const sys=document.getElementById("system"); let h="";
  h+='<defs><radialGradient id="sun"><stop offset="0" stop-color="#fff4cf"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>';
  h+='<radialGradient id="pl"><stop offset="0" stop-color="#a9b4ff"/><stop offset="1" stop-color="#4a56d6"/></radialGradient></defs>';
  h+='<circle cx="200" cy="200" r="46" fill="url(#sun)"/><circle cx="200" cy="200" r="15" fill="#ffd27a"/>';
  [[70,"o1"],[120,"o2"],[180,"o3"]].forEach(([r,c])=>{ h+=`<circle class="path" cx="200" cy="200" r="${r}"/>`; });
  h+='<g class="orb o1"><circle cx="270" cy="200" r="7" fill="url(#pl)"/></g>';
  h+='<g class="orb o2"><circle cx="200" cy="80" r="11" fill="#5fe3b0"/><circle cx="217" cy="72" r="3" fill="#e9eefc"/></g>';
  h+='<g class="orb o3"><circle cx="20" cy="200" r="14" fill="#c98cff"/><ellipse cx="20" cy="200" rx="26" ry="6" fill="none" stroke="#e9d4ff" stroke-width="1.5" opacity=".8"/></g>';
  sys.innerHTML=h;
})();

// ---------- Capa de API: usa el backend si responde; si no, modo demostración ----------
const BASE = "";                          // mismo origen que el servidor
const mock = {                            // réplica en memoria de los endpoints del backend Java
  usuarios:[], eventos:[], uid:1, eid:1,
  async req(method, path, body){
    const j = (x)=>JSON.parse(JSON.stringify(x));
    if(path==="/usuarios" && method==="POST"){
      if(this.usuarios.some(u=>u.correo===body.correo)) return {status:409,data:{error:"El correo ya está registrado"}};
      const u={id:this.uid++,nombre:body.nombre,correo:body.correo,password:body.password};
      this.usuarios.push(u); return {status:200,data:{id:u.id,nombre:u.nombre,correo:u.correo}};
    }
    if(path==="/login" && method==="POST"){
      const u=this.usuarios.find(x=>x.correo===body.correo && x.password===body.contrasena);
      return u?{status:200,data:{id:u.id,nombre:u.nombre,correo:u.correo}}:{status:401,data:null};
    }
    if(path==="/eventos" && method==="GET") return {status:200,data:j(this.eventos)};
    if(path==="/eventos" && method==="POST"){
      const e={id:this.eid++,nombre:body.nombre,descripcion:body.descripcion||""}; this.eventos.push(e); return {status:200,data:j(e)};
    }
    const m=path.match(/^\/eventos\/(\d+)$/);
    if(m && method==="DELETE"){ this.eventos=this.eventos.filter(e=>e.id!==+m[1]); return {status:200,data:null}; }
    return {status:404,data:null};
  }
};
let live=false;
async function api(method, path, body){
  if(live){
    const r=await fetch(BASE+path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    let data=null; try{ data=await r.json(); }catch(_){}
    return {status:r.status,data};
  }
  return mock.req(method,path,body);
}
async function detect(){
  const dot=document.getElementById("dot"), t=document.getElementById("statusText");
  try{
    const r=await fetch(BASE+"/eventos",{signal:AbortSignal.timeout(2500)});
    if(!r.ok || !(r.headers.get("content-type")||"").includes("json")) throw 0;
    live=true; dot.className="dot ok"; t.textContent="Conectado a la API";
  }catch(_){
    live=false; dot.className="dot demo"; t.textContent="Modo demostración (sin servidor)";
  }
}

// ---------- Interfaz ----------
const $=(id)=>document.getElementById(id);
let user=null;
const say=(el,text,type)=>{el.textContent=text;el.className="msg"+(type?" "+type:"");};

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  const reg=b.dataset.tab==="reg";
  $("tab-login").setAttribute("aria-selected",String(!reg)); $("tab-reg").setAttribute("aria-selected",String(reg));
  $("f-login").classList.toggle("hidden",reg); $("f-reg").classList.toggle("hidden",!reg); say($("authMsg"),"");
}));

function showSession(){
  $("guest").classList.toggle("hidden",!!user); $("logged").classList.toggle("hidden",!user);
  if(user){ $("who").textContent=user.nombre; $("avatar").textContent=(user.nombre||"?").trim().charAt(0).toUpperCase(); }
}

$("f-reg").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const nombre=$("r-nombre").value.trim(), correo=$("r-correo").value.trim(), password=$("r-pass").value;
  if(!nombre||!correo||!password) return say($("authMsg"),"Completa nombre, correo y contraseña.","err");
  const r=await api("POST","/usuarios",{nombre,correo,password});
  if(r.status===200){ $("f-reg").reset(); $("tab-login").click(); $("l-correo").value=correo; say($("authMsg"),"Cuenta creada. Ya puedes iniciar sesión.","ok"); }
  else say($("authMsg"),(r.data&&r.data.error)||"No se pudo crear la cuenta.","err");
});

$("f-login").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const correo=$("l-correo").value.trim(), contrasena=$("l-pass").value;
  if(!correo||!contrasena) return say($("authMsg"),"Escribe tu correo y contraseña.","err");
  const r=await api("POST","/login",{correo,contrasena});
  if(r.status===200){ user=r.data; say($("authMsg"),""); $("f-login").reset(); showSession(); }
  else say($("authMsg"),"Correo o contraseña incorrectos.","err");
});
$("logout").addEventListener("click",()=>{ user=null; showSession(); });

async function loadEvents(){
  const r=await api("GET","/eventos"); const ul=$("evList"); ul.innerHTML="";
  const list=(r.data||[]); $("evCount").textContent=list.length;
  if(!list.length){ ul.innerHTML='<li class="empty">Aún no hay eventos. Guarda el primero con el formulario.</li>'; return; }
  list.forEach(ev=>{
    const li=document.createElement("li");
    const ico=document.createElement("span"); ico.className="ev-ico"; ico.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>';
    const box=document.createElement("div"), h=document.createElement("h3"), p=document.createElement("p"); box.className="ev-body";
    h.textContent=ev.nombre; p.textContent=ev.descripcion||"Sin descripción"; box.append(h,p);
    const del=document.createElement("button"); del.className="btn ghost"; del.type="button"; del.textContent="Eliminar";
    del.addEventListener("click",async()=>{ await api("DELETE","/eventos/"+ev.id); say($("evMsg"),"Evento eliminado.","ok"); loadEvents(); });
    li.append(ico,box,del); ul.append(li);
  });
}
$("f-ev").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const nombre=$("e-nombre").value.trim(), descripcion=$("e-desc").value.trim();
  if(!nombre) return say($("evMsg"),"Escribe un nombre para el evento.","err");
  const r=await api("POST","/eventos",{nombre,descripcion});
  if(r.status===200){ say($("evMsg"),"Evento guardado.","ok"); $("f-ev").reset(); loadEvents(); }
  else say($("evMsg"),"No se pudo guardar el evento.","err");
});

$("ctaReg").addEventListener("click",()=>$("tab-reg").click());
(async()=>{ await detect(); showSession(); loadEvents(); })();
</script>
</body>
</html>
