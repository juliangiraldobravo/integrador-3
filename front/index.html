<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrologic</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060914;--sf:rgba(15,21,48,.78);--sf2:rgba(8,12,30,.7);--ink:#eef2ff;--mu:#9aa7cf;--ln:rgba(140,160,255,.18);--ln2:rgba(140,160,255,.34);--ac:#ffb347;--ac2:#ff9a3d;--gl:#7482ff;--ok:#5fe3b0;--er:#ff9a9a;
--d:"Syne","Trebuchet MS",system-ui,sans-serif;--b:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--b);min-height:100vh;background:radial-gradient(1000px 560px at 88% -8%,rgba(116,130,255,.26),transparent 62%),radial-gradient(760px 520px at -12% 38%,rgba(126,64,180,.2),transparent 62%),var(--bg);background-attachment:fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px 20px 36px}
.nav{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--ln);position:relative}
.sp{flex:1}.brand{display:flex;align-items:center;gap:9px;font:700 21px/1 var(--d);color:var(--ink);text-decoration:none}.brand svg{width:26px;height:26px}
.ib{background:var(--sf2);border:1px solid var(--ln2);color:var(--ink);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.status{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--ln);border-radius:999px;background:var(--sf2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.demo{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.chip{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--ln2);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font:600 14px var(--b);cursor:pointer;max-width:200px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--gl),#c98cff);color:#0b1030;font:700 15px var(--d);flex:none}
.pop{position:absolute;right:0;top:56px;z-index:30;width:270px;background:#0e1431;border:1px solid var(--ln2);border-radius:12px;padding:16px;box-shadow:0 24px 48px -16px #000}
.pop .who{display:flex;gap:12px;align-items:center;margin-bottom:12px}.pop small{color:var(--mu);display:block;overflow-wrap:anywhere}.pop .btn{margin:8px 0 0;width:100%}
#drawer{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:86vw;z-index:50;background:#0b1129;border-right:1px solid var(--ln2);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;transform:translateX(-102%);transition:transform .2s;overflow:auto}
#drawer.open{transform:none}#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none}#scrim.on{display:block}
#drawer h3{font:700 13px var(--b);color:var(--mu);margin:6px 10px 12px}
#drawer a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
#drawer a:hover,#drawer a.on{background:rgba(116,130,255,.2)}#drawer svg{width:19px;height:19px;color:var(--ac);flex:none}
h1,h2{font-family:var(--d);margin:0}h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.02em}
h2{font-size:20px}.pg{padding:30px 0 0}.pg>h1{font-size:clamp(28px,4vw,40px);margin-bottom:6px}.lead{color:var(--mu);margin:0 0 22px;max-width:60ch}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:34px 0 40px}.hero p{color:var(--mu);font-size:17px;max-width:46ch;margin:16px 0 24px}
.system{width:100%;max-width:380px;justify-self:center}.system .path{fill:none;stroke:var(--ln2);stroke-dasharray:2 6}.orb{transform-origin:200px 200px;animation:sp linear infinite}.o1{animation-duration:24s}.o2{animation-duration:46s}.o3{animation-duration:80s}
@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:24px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -24px #000;backdrop-filter:blur(10px)}
.card h2{margin-bottom:14px}.card.sm{padding:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:13px 0 5px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--sf2);border:1px solid var(--ln2);border-radius:8px;padding:10px 12px}
select option{background:#0e1431}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gl);box-shadow:0 0 0 3px rgba(116,130,255,.28)}textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;background:linear-gradient(180deg,var(--ac),var(--ac2));color:#1b1204;border:0;border-radius:8px;font:700 15px var(--b);padding:10px 18px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn.g{background:none;color:var(--ink);border:1px solid var(--ln2);margin:0;padding:6px 12px;font-size:13px;font-weight:600}.btn.blk{width:100%}
.msg{min-height:20px;margin:12px 0 0;font-size:14px}.msg.err{color:var(--er)}.msg.ok{color:var(--ok)}.mu{color:var(--mu)}.hid{display:none!important}
.list{display:grid;gap:10px;margin-top:6px}.ev{display:flex;gap:14px;align-items:center;padding:13px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--sf2)}
.ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:rgba(255,179,71,.14);color:var(--ac);flex:none;font-size:18px}
.ev .b{flex:1;min-width:0}.ev h3{margin:0;font:700 16px/1.3 var(--d)}.ev p{margin:2px 0 0;color:var(--mu);font-size:14px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--mu);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(95,227,176,.16);color:var(--ok);margin-left:6px}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--ln2);border-radius:10px}
.sec{margin:34px 0 12px;display:flex;align-items:baseline;gap:10px}
.avbig{display:flex;gap:16px;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wx{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.wx .t{font:700 44px/1 var(--d)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.az button{width:30px;height:30px;border-radius:6px;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);font:600 13px var(--b);cursor:pointer}
.az button.on{background:var(--gl)}.az button:disabled{opacity:.3;cursor:default}
.dict h3{font:700 22px var(--d);color:var(--ac);margin:22px 0 6px;border-bottom:1px solid var(--ln);padding-bottom:4px}
.ct{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);padding:10px 4px;font:inherit;cursor:pointer}
.ct:hover,.ct.on{background:rgba(116,130,255,.14)}.ct small{color:var(--mu)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--ln);color:var(--mu);font-size:13px}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:24px}.status{display:none}}
</style></head><body>
<svg id="stars" aria-hidden="true"></svg>
<div class="wrap">
<header class="nav">
 <button class="ib" id="burger" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
 <a class="brand" href="#inicio" data-go="inicio"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#ffb347"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="#9aa7cf" stroke-width="1.5" transform="rotate(-28 16 16)"/><circle cx="26" cy="10" r="2" fill="#7482ff"/></svg>Astrologic</a>
 <span class="sp"></span><span class="status"><span class="dot" id="dot"></span><span id="st">Conectando…</span></span>
 <div id="acct"></div>
</header>
<nav id="drawer" aria-label="Menú principal"></nav><div id="scrim"></div>
<main id="view"></main>
<footer>Astrologic, proyecto integrador. Las fechas de lluvias de meteoros son aproximadas.</footer>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const C=("AR|Argentina|América del Sur|Buenos Aires;BO|Bolivia|América del Sur|Sucre;BR|Brasil|América del Sur|Brasilia;CL|Chile|América del Sur|Santiago;CO|Colombia|América del Sur|Bogotá;EC|Ecuador|América del Sur|Quito;PY|Paraguay|América del Sur|Asunción;PE|Perú|América del Sur|Lima;UY|Uruguay|América del Sur|Montevideo;VE|Venezuela|América del Sur|Caracas;CR|Costa Rica|América Central|San José;CU|Cuba|El Caribe|La Habana;SV|El Salvador|América Central|San Salvador;GT|Guatemala|América Central|Ciudad de Guatemala;HN|Honduras|América Central|Tegucigalpa;MX|México|América del Norte|Ciudad de México;NI|Nicaragua|América Central|Managua;PA|Panamá|América Central|Ciudad de Panamá;DO|República Dominicana|El Caribe|Santo Domingo;US|Estados Unidos|América del Norte|Washington D. C.;CA|Canadá|América del Norte|Ottawa;ES|España|Europa|Madrid;PT|Portugal|Europa|Lisboa;FR|Francia|Europa|París;DE|Alemania|Europa|Berlín;IT|Italia|Europa|Roma;GB|Reino Unido|Europa|Londres;IE|Irlanda|Europa|Dublín;NL|Países Bajos|Europa|Ámsterdam;BE|Bélgica|Europa|Bruselas;CH|Suiza|Europa|Berna;SE|Suecia|Europa|Estocolmo;NO|Noruega|Europa|Oslo;PL|Polonia|Europa|Varsovia;GR|Grecia|Europa|Atenas;TR|Turquía|Asia|Ankara;RU|Rusia|Europa|Moscú;UA|Ucrania|Europa|Kiev;CN|China|Asia|Pekín;JP|Japón|Asia|Tokio;KR|Corea del Sur|Asia|Seúl;IN|India|Asia|Nueva Delhi;ID|Indonesia|Asia|Yakarta;TH|Tailandia|Asia|Bangkok;PH|Filipinas|Asia|Manila;AU|Australia|Oceanía|Canberra;NZ|Nueva Zelanda|Oceanía|Wellington;ZA|Sudáfrica|África|Pretoria;EG|Egipto|África|El Cairo;MA|Marruecos|África|Rabat;NG|Nigeria|África|Abuya;KE|Kenia|África|Nairobi;SA|Arabia Saudita|Asia|Riad;AE|Emiratos Árabes Unidos|Asia|Abu Dabi;IL|Israel|Asia|Jerusalén").split(';').map(x=>{const[a,b,c,d]=x.split('|');return{code:a,name:b,cont:c,cap:d}}).sort((a,b)=>a.name.localeCompare(b.name,'es'));
const cname=k=>(C.find(c=>c.code===k)||{}).name||'';
const copts=sel=>'<option value="">Selecciona un país</option>'+C.map(c=>`<option value="${c.code}"${c.code===sel?' selected':''}>${esc(c.name)}</option>`).join('');
// ---- API (servidor real o modo demostración con datos locales) ----
let live=false;
const db=LS.get('astro_db')||{u:[],e:[],ui:1,ei:1};const save=()=>LS.set('astro_db',db);
const pub=u=>{const{password,...r}=u;return r};
const mock={async req(m,p,b){let x;
 if(p==='/usuarios'&&m==='POST'){if(db.u.some(u=>u.correo===b.correo))return{s:409,d:{error:'El correo ya está registrado'}};x={id:db.ui++,nombre:b.nombre,correo:b.correo,password:b.password,avatar:'',pais:'',municipio:'',direccion:''};db.u.push(x);save();return{s:200,d:pub(x)}}
 if(p==='/login'){x=db.u.find(u=>u.correo===b.correo&&u.password===b.contrasena);return x?{s:200,d:pub(x)}:{s:401,d:null}}
 if(x=p.match(/^\/usuarios\/(\d+)(\/password)?$/)){const u=db.u.find(k=>k.id==x[1]);if(!u)return{s:404,d:null};
  if(x[2]){if(u.password!==b.actual)return{s:403,d:{error:'La contraseña actual no es correcta'}};u.password=b.nueva;save();return{s:200,d:{}}}
  if(b.correo&&db.u.some(k=>k.correo===b.correo&&k.id!==u.id))return{s:409,d:{error:'Ese correo ya está en uso'}};Object.assign(u,b);db.e.forEach(e=>{if(e.autorId===u.id)e.autor=u.nombre});save();return{s:200,d:pub(u)}}
 if(p==='/eventos'&&m==='GET')return{s:200,d:db.e};
 if(p==='/eventos'&&m==='POST'){x={id:db.ei++,...b};db.e.push(x);save();return{s:200,d:x}}
 if(x=p.match(/^\/eventos\/(\d+)$/)){db.e=db.e.filter(e=>e.id!=x[1]);save();return{s:200,d:null}}
 return{s:404,d:null}}};
async function api(m,p,b){if(!live)return mock.req(m,p,b);const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let d=null;try{d=await r.json()}catch(e){}return{s:r.status,d}}
async function detect(){try{const r=await fetch('/eventos',{signal:AbortSignal.timeout(2500)});if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))throw 0;live=true;$('#dot').className='dot ok';$('#st').textContent='Conectado a la API'}catch(e){live=false;$('#dot').className='dot demo';$('#st').textContent='Modo demostración'}}
// ---- Datos astronómicos (calculados con la fecha de hoy) ----
const SH=[['Cuadrántidas','12-28','01-12','01-03'],['Líridas','04-14','04-30','04-22'],['Eta Acuáridas','04-19','05-28','05-06'],['Delta Acuáridas Sur','07-12','08-23','07-30'],['Perseidas','07-17','08-24','08-12'],['Oriónidas','10-02','11-07','10-21'],['Táuridas Sur','09-10','11-20','11-05'],['Táuridas Norte','10-20','12-10','11-12'],['Leónidas','11-06','11-30','11-17'],['Gemínidas','12-04','12-20','12-14'],['Úrsidas','12-17','12-26','12-22']];
const doy=(m,d)=>Math.round((Date.UTC(2001,m-1,d)-Date.UTC(2001,0,0))/864e5),md=s=>doy(...s.split('-').map(Number)),today=()=>new Date().toLocaleDateString('en-CA');
function showers(now=new Date()){const t=doy(now.getMonth()+1,now.getDate()),a=[],n=[];SH.forEach(([nm,s,e,p])=>{const S=md(s),E=md(e),on=S<=E?t>=S&&t<=E:(t>=S||t<=E);const until=(S-t+365)%365;on?a.push({nm,e,p,pk:Math.abs(t-md(p))<=1}):until<=45&&n.push({nm,s,until})});return{a,n:n.sort((x,y)=>x.until-y.until).slice(0,3)}}
function moon(now=new Date()){const age=(((now-Date.UTC(2000,0,6,18,14))/864e5)%29.530588853+29.530588853)%29.530588853,ill=Math.round((1-Math.cos(2*Math.PI*age/29.530588853))/2*100),N=['Luna nueva','Creciente','Cuarto creciente','Gibosa creciente','Luna llena','Gibosa menguante','Cuarto menguante','Menguante'];return{n:N[Math.floor((age/29.530588853*8+.5))%8],ill,age:age.toFixed(1)}}
// ---- Estado y navegación ----
let S={user:LS.get('astro_user'),view:'inicio',events:[],cf:{q:'',l:'',sel:''}};
const NAV=[['inicio','Inicio','M3 11l9-8 9 8v10H3z'],['cuenta','Cuenta','M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 3.6-7 8-7s8 3 8 7'],['crear','Crear evento','M12 5v14M5 12h14'],['mis','Mis eventos','M4 6h16M4 12h16M4 18h10'],['cerca','Cercanos y clima','M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11zM12 12a2 2 0 100-4 2 2 0 000 4'],['paises','Explorar por país','M12 21a9 9 0 100-18 9 9 0 000 18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18']];
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const av=(u,s=40)=>u.avatar?`<img class="av" src="${esc(u.avatar)}" alt="" style="width:${s}px;height:${s}px">`:`<span class="av" style="width:${s}px;height:${s}px">${esc((u.nombre||'?').trim()[0]||'?').toUpperCase()}</span>`;
const place=e=>[e.municipio,cname(e.pais)].filter(Boolean).join(', ');
function drawer(){$('#drawer').innerHTML='<h3>Menú</h3>'+NAV.map(([k,t,d])=>`<a href="#${k}" data-go="${k}" class="${S.view===k?'on':''}">${ic(d)}${t}</a>`).join('')}
function acct(){const u=S.user,el=$('#acct');if(!u){el.innerHTML='<button class="btn g" data-go="cuenta">Iniciar sesión</button>';return}
 el.innerHTML=`<button class="chip" id="chip" aria-expanded="false">${av(u,30)}<span>${esc(u.nombre)}</span></button><div class="pop hid" id="pop"><div class="who">${av(u,48)}<div><strong>${esc(u.nombre)}</strong><small>${esc(u.correo)}</small><small>${esc(place(u)||'Sin ubicación')}</small></div></div><button class="btn g blk" data-go="cuenta">Editar perfil</button><button class="btn g blk" id="out">Cerrar sesión</button></div>`;
 $('#chip').onclick=()=>{const h=$('#pop').classList.toggle('hid');$('#chip').setAttribute('aria-expanded',String(!h))};$('#out').onclick=()=>{S.user=null;LS.set('astro_user',null);acct();go('inicio')}}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}toggle(false);drawer();render();scrollTo(0,0)}
function toggle(o){$('#drawer').classList.toggle('open',o);$('#scrim').classList.toggle('on',o);$('#burger').setAttribute('aria-expanded',String(o))}
async function loadEv(){S.events=(await api('GET','/eventos')).d||[]}
const evHtml=(e,del)=>`<div class="ev"><span class="ico">★</span><div class="b"><h3>${esc(e.nombre)}</h3><p>${esc(e.descripcion||'Sin descripción')}</p><div class="meta">${esc([e.fecha,place(e),e.autor&&'por '+e.autor].filter(Boolean).join(' | '))}</div></div>${del?`<button class="btn g" data-del="${e.id}">Eliminar</button>`:''}</div>`;
const need=t=>`<div class="empty">${t}<br><button class="btn" data-go="cuenta">Iniciar sesión o crear cuenta</button></div>`;
const head=(t,l)=>`<div class="pg"><h1>${t}</h1><p class="lead">${l}</p>`;
async function render(){await loadEv();const u=S.user,v=$('#view'),V=S.view;
 if(V==='inicio'){const sh=showers(),mo=moon(),hoy=S.events.filter(e=>e.fecha===today());
  v.innerHTML=`<div class="hero"><div><h1>Tus eventos, en órbita.</h1><p>Crea tu cuenta, guarda tus eventos y mira qué está pasando en el cielo ahora mismo.</p><button class="btn" data-go="${u?'crear':'cuenta'}">${u?'Crear un evento':'Crear cuenta'}</button></div><svg class="system" viewBox="0 0 400 400" role="img" aria-label="Sistema solar decorativo"><defs><radialGradient id="sun"><stop offset="0" stop-color="#fff4cf"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="46" fill="url(#sun)"/><circle cx="200" cy="200" r="15" fill="#ffd27a"/><circle class="path" cx="200" cy="200" r="70"/><circle class="path" cx="200" cy="200" r="120"/><circle class="path" cx="200" cy="200" r="180"/><g class="orb o1"><circle cx="270" cy="200" r="7" fill="#7482ff"/></g><g class="orb o2"><circle cx="200" cy="80" r="11" fill="#5fe3b0"/></g><g class="orb o3"><circle cx="20" cy="200" r="14" fill="#c98cff"/><ellipse cx="20" cy="200" rx="26" ry="6" fill="none" stroke="#e9d4ff" opacity=".8"/></g></svg></div>
  <div class="sec"><h2>Ocurriendo ahora</h2><span class="mu">${new Date().toLocaleDateString('es',{dateStyle:'long'})}</span></div><div class="list">
  <div class="ev"><span class="ico">☾</span><div class="b"><h3>${mo.n}</h3><p>Iluminación de la Luna: ${mo.ill}%. Edad lunar: ${mo.age} días.</p></div></div>
  ${sh.a.map(s=>`<div class="ev"><span class="ico">✦</span><div class="b"><h3>${s.nm}${s.pk?'<span class="tag">Máximo</span>':''}</h3><p>Lluvia de meteoros activa hasta el ${s.e.split('-').reverse().join('/')}. Máximo cerca del ${s.p.split('-').reverse().join('/')}.</p></div></div>`).join('')}
  ${hoy.map(e=>evHtml(e)).join('')}</div>
  ${sh.n.length?`<div class="sec"><h2>Próximamente</h2></div><div class="list">${sh.n.map(s=>`<div class="ev"><span class="ico">◌</span><div class="b"><h3>${s.nm}</h3><p>Empieza en ${s.until} días (${s.s.split('-').reverse().join('/')}).</p></div></div>`).join('')}</div>`:''}`}
 else if(V==='cuenta'){if(!u)v.innerHTML=head('Cuenta','Inicia sesión o crea una cuenta nueva.')+`<div class="grid"><form class="card" id="f-login"><h2>Iniciar sesión</h2><label for="lc">Correo</label><input id="lc" type="email" autocomplete="email"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password"><button class="btn blk">Iniciar sesión</button><p class="msg" id="m1"></p></form><form class="card" id="f-reg"><h2>Crear cuenta</h2><label for="rn">Nombre</label><input id="rn" autocomplete="name"><label for="rc">Correo</label><input id="rc" type="email" autocomplete="email"><label for="rp">Contraseña</label><input id="rp" type="password" autocomplete="new-password"><button class="btn blk">Crear cuenta</button><p class="msg" id="m2"></p></form></div></div>`;
  else v.innerHTML=head('Mi cuenta','Administra tu perfil, tu contraseña y tu ubicación.')+`<div class="grid"><div class="card"><h2>Foto de perfil</h2><div class="avbig">${av(u,84)}<div class="row"><label class="btn g" style="margin:0;cursor:pointer;color:var(--ink)">Cambiar foto<input id="foto" type="file" accept="image/*" class="hid"></label>${u.avatar?'<button class="btn g" id="nofoto">Quitar</button>':''}</div></div><p class="msg" id="m0"></p></div>
  <form class="card" id="f-datos"><h2>Datos personales</h2><label for="dn">Nombre</label><input id="dn" value="${esc(u.nombre)}"><label for="dc">Correo</label><input id="dc" type="email" value="${esc(u.correo)}"><button class="btn">Guardar datos</button><p class="msg" id="m3"></p></form>
  <form class="card" id="f-pass"><h2>Contraseña</h2><label for="pa">Contraseña actual</label><input id="pa" type="password" autocomplete="current-password"><label for="pn">Contraseña nueva</label><input id="pn" type="password" autocomplete="new-password"><label for="pr">Repite la nueva</label><input id="pr" type="password" autocomplete="new-password"><button class="btn">Cambiar contraseña</button><p class="msg" id="m4"></p></form>
  <form class="card" id="f-ubi"><h2>Ubicación</h2><p class="mu" style="margin:0 0 4px;font-size:14px">Por seguridad basta con el país y el municipio. Se usan para mostrarte eventos cercanos y el clima.</p><label for="up">País</label><select id="up">${copts(u.pais)}</select><label for="um">Municipio</label><input id="um" value="${esc(u.municipio)}"><label for="ud">Dirección (opcional)</label><input id="ud" value="${esc(u.direccion)}"><button class="btn">Guardar ubicación</button><p class="msg" id="m5"></p></form></div></div>`}
 else if(V==='crear')v.innerHTML=head('Crear evento','Publica un evento con fecha y lugar.')+(!u?need('Necesitas una cuenta para crear eventos.'):`<form class="card" id="f-ev" style="max-width:560px"><label for="en">Nombre del evento</label><input id="en"><label for="ed">Descripción</label><textarea id="ed"></textarea><label for="ef">Fecha</label><input id="ef" type="date" value="${today()}"><label for="ep">País</label><select id="ep">${copts(u.pais)}</select><label for="em">Municipio</label><input id="em" value="${esc(u.municipio)}"><button class="btn">Guardar evento</button><p class="msg" id="m6"></p></form>`)+'</div>';
 else if(V==='mis'){const m=u?S.events.filter(e=>e.autorId===u.id):[];v.innerHTML=head('Mis eventos','Los eventos que has creado.')+(!u?need('Inicia sesión para ver tus eventos.'):m.length?`<div class="list">${m.map(e=>evHtml(e,1)).join('')}</div>`:`<div class="empty">Aún no has creado eventos.<br><button class="btn" data-go="crear">Crear el primero</button></div>`)+'</div>'}
 else if(V==='cerca'){v.innerHTML=head('Cercanos y clima','Eventos y tiempo según tu país y municipio.')+(!u?need('Inicia sesión para ver datos de tu zona.'):!u.pais?`<div class="empty">Agrega tu país y municipio en tu cuenta.<br><button class="btn" data-go="cuenta">Ir a mi cuenta</button></div>`:`<div class="card sm"><h2>Clima en ${esc(place(u))}</h2><div id="wx" class="mu">Consultando…</div></div><div class="sec"><h2>Eventos cercanos</h2></div><div id="near" class="list"></div>`)+'</div>';
  if(u&&u.pais){const n=S.events.filter(e=>e.pais===u.pais).sort((a,b)=>(b.municipio===u.municipio)-(a.municipio===u.municipio));$('#near').innerHTML=n.length?n.map(e=>evHtml(e)).join(''):`<div class="empty">No hay eventos en ${esc(cname(u.pais))} todavía.</div>`;weather(u)}}
 else if(V==='paises'){v.innerHTML=head('Explorar por país','Diccionario de países: busca, elige una letra y mira sus eventos.')+`<input id="q" placeholder="Buscar país, capital o continente" value="${esc(S.cf.q)}"><div class="az" id="az"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="dict" id="dict"></div><div id="cev"></div></div></div>`;$('#q').oninput=e=>{S.cf.q=e.target.value;dict()};dict()}}
function dict(){const{q,l,sel}=S.cf,n=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),f=C.filter(c=>n(c.name+c.cap+c.cont).includes(n(q))),L=[...new Set(C.map(c=>n(c.name)[0].toUpperCase()))],has=new Set(f.map(c=>n(c.name)[0].toUpperCase()));
 $('#az').innerHTML=L.map(x=>`<button data-l="${x}" class="${l===x?'on':''}"${has.has(x)?'':' disabled'}>${x}</button>`).join('')+(l?'<button data-l="" style="width:auto;padding:0 10px">Todas</button>':'');
 let h='',cur='';f.filter(c=>!l||n(c.name)[0].toUpperCase()===l).forEach(c=>{const L0=n(c.name)[0].toUpperCase();if(L0!==cur){cur=L0;h+=`<h3>${L0}</h3>`}const k=S.events.filter(e=>e.pais===c.code).length;h+=`<button class="ct ${sel===c.code?'on':''}" data-c="${c.code}"><span>${esc(c.name)}<br><small>${esc(c.cap)}, ${esc(c.cont)}</small></span><small>${k} evento${k===1?'':'s'}</small></button>`});
 $('#dict').innerHTML=h||'<div class="empty">Sin resultados.</div>';const ev=sel?S.events.filter(e=>e.pais===sel):[];
 $('#cev').innerHTML=sel?`<div class="card sm"><h2>Eventos en ${esc(cname(sel))}</h2><div class="list">${ev.length?ev.map(e=>evHtml(e)).join(''):'<div class="empty">Sin eventos en este país.</div>'}</div></div>`:'<div class="empty">Elige un país de la lista para ver sus eventos.</div>'}
const WC=c=>c===0?'Despejado':c<4?'Parcialmente nublado':c<50?'Niebla':c<60?'Llovizna':c<70?'Lluvia':c<80?'Nieve':c<90?'Chubascos':'Tormenta';
async function weather(u){const el=$('#wx');try{const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=es&name='+encodeURIComponent(u.municipio||cname(u.pais)),{signal:AbortSignal.timeout(6000)})).json();const p=(g.results||[]).find(r=>r.country_code===u.pais)||(g.results||[])[0];if(!p){el.textContent='No se encontró ese municipio.';return}
 const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`,{signal:AbortSignal.timeout(6000)})).json(),c=w.current,d=w.daily;
 el.innerHTML=`<div class="wx"><div class="t">${Math.round(c.temperature_2m)}°C</div><div><strong>${WC(c.weather_code)}</strong><br>Humedad ${c.relative_humidity_2m}%, viento ${c.wind_speed_10m} km/h</div></div><div class="list" style="margin-top:14px">${d.time.map((t,i)=>`<div class="ev"><div class="b"><h3>${new Date(t+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'})}</h3><p>Mín. ${Math.round(d.temperature_2m_min[i])}°C, máx. ${Math.round(d.temperature_2m_max[i])}°C, lluvia ${d.precipitation_probability_max[i]??0}%</p></div></div>`).join('')}</div>`}
 catch(e){el.innerHTML='No se pudo consultar el servicio del clima desde esta vista. Al abrir el proyecto en tu computador con conexión a internet se mostrará aquí.'}}
// ---- Eventos de la interfaz ----
const say=(id,t,k)=>{const e=$('#'+id);if(e){e.textContent=t;e.className='msg '+(k||'')}};
async function setUser(d){S.user=d;LS.set('astro_user',d);acct()}
async function upd(body,id,ok){const r=await api('PUT','/usuarios/'+S.user.id,body);if(r.s===200){await setUser(r.d);say(id,ok,'ok');drawer()}else say(id,(r.d&&r.d.error)||'No se pudo guardar.','err')}
document.addEventListener('click',async e=>{const t=e.target;
 const g=t.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
 if(t.closest('#burger'))return toggle(!$('#drawer').classList.contains('open'));if(t.id==='scrim')toggle(false);
 if(!t.closest('#acct')){const p=$('#pop');p&&p.classList.add('hid')}
 const d=t.closest('[data-del]');if(d){await api('DELETE','/eventos/'+d.dataset.del);return render()}
 if(t.dataset.l!==undefined&&t.closest('#az')){S.cf.l=t.dataset.l;return dict()}
 const c=t.closest('[data-c]');if(c){S.cf.sel=c.dataset.c;return dict()}
 if(t.id==='nofoto')upd({avatar:''},'m0','Foto eliminada.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});
document.addEventListener('change',e=>{if(e.target.id!=='foto'||!e.target.files[0])return;const im=new Image(),fr=new FileReader();fr.onload=()=>{im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);upd({avatar:cv.toDataURL('image/jpeg',.82)},'m0','Foto actualizada.')};im.src=fr.result};fr.readAsDataURL(e.target.files[0])});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.id,v=i=>$('#'+i).value.trim();
 if(f==='f-login'){const r=await api('POST','/login',{correo:v('lc'),contrasena:$('#lp').value});if(r.s===200){await setUser(r.d);go('cuenta')}else say('m1','Correo o contraseña incorrectos.','err')}
 if(f==='f-reg'){if(!v('rn')||!v('rc')||!$('#rp').value)return say('m2','Completa nombre, correo y contraseña.','err');const r=await api('POST','/usuarios',{nombre:v('rn'),correo:v('rc'),password:$('#rp').value});if(r.s===200){say('m2','Cuenta creada. Ya puedes iniciar sesión.','ok');$('#lc').value=v('rc');$('#f-reg').reset()}else say('m2',(r.d&&r.d.error)||'No se pudo crear la cuenta.','err')}
 if(f==='f-datos')v('dn')&&v('dc')?upd({nombre:v('dn'),correo:v('dc')},'m3','Datos guardados.'):say('m3','Nombre y correo son obligatorios.','err');
 if(f==='f-pass'){if($('#pn').value.length<4)return say('m4','La nueva contraseña debe tener al menos 4 caracteres.','err');if($('#pn').value!==$('#pr').value)return say('m4','Las contraseñas nuevas no coinciden.','err');const r=await api('PUT','/usuarios/'+S.user.id+'/password',{actual:$('#pa').value,nueva:$('#pn').value});r.s===200?(say('m4','Contraseña actualizada.','ok'),$('#f-pass').reset()):say('m4',(r.d&&r.d.error)||'No se pudo cambiar.','err')}
 if(f==='f-ubi')upd({pais:$('#up').value,municipio:v('um'),direccion:v('ud')},'m5','Ubicación guardada.');
 if(f==='f-ev'){if(!v('en'))return say('m6','Escribe un nombre para el evento.','err');const r=await api('POST','/eventos',{nombre:v('en'),descripcion:v('ed'),fecha:$('#ef').value,pais:$('#ep').value,municipio:v('em'),autorId:S.user.id,autor:S.user.nombre});if(r.s===200){go('mis')}else say('m6','No se pudo guardar.','err')}});
// ---- Cielo estrellado ----
(()=>{let s=7,r=()=>(s=s*16807%2147483647)/2147483647,h='';for(let i=0;i<130;i++)h+=`<circle cx="${(r()*100).toFixed(1)}%" cy="${(r()*100).toFixed(1)}%" r="${(r()*1.3+.3).toFixed(1)}" fill="#fff" opacity="${(r()*.6+.3).toFixed(2)}"/>`;$('#stars').innerHTML=h})();
(async()=>{await detect();const t=location.hash.slice(1);S.view=NAV.some(n=>n[0]===t)?t:'inicio';acct();drawer();render()})();
</script></body></html>
